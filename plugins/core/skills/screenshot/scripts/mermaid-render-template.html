<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 28px; background: #fff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #out svg { max-width: none !important; }
  h3 { margin: 0 0 16px; color: #1f2d3d; font-size: 16px; }
</style>
</head>
<body>
<h3>{{TITLE}}</h3>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
const src = `{{MERMAID_SOURCE}}`;
mermaid.initialize({ startOnLoad: false, theme: 'default', flowchart: { useMaxWidth: false, htmlLabels: true } });
mermaid.render('g1', src).then(({ svg }) => { document.getElementById('out').innerHTML = svg; });
</script>
</body>
</html>
